services:
  guidekaro-dashboard:
    build:
      context: .
      dockerfile: Dockerfile

    image: kevin1362/guidekaro-dashboard:assignment9

    container_name: guidekaro-dashboard

    ports:
      - "8501:8501"
      - "8000:8000"

    environment:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: guidekaro_local_user
      EXPECTED_ACCURACY: "0.90"
      EXPERIMENT_NAME: guidekaro_enhanced
      EXPERIMENT_VERSION: "1.0"
      FEATURE_NAMES: risk_score,vehicle_speed_kmh,distance_to_crosswalk_m,pedestrian_vehicle_distance_m,confidence,ttc_seconds
      MODEL_CONFIDENCE_THRESHOLD: "0.35"
      NUM_EPOCHS: "50"
      PIXELS_PER_METER: "22.0"

    secrets:
      - guidekaro_secret

    volumes:
      - ./database:/app/database
      - ./assets:/app/assets
      - ./logs:/app/logs

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    restart: unless-stopped

secrets:
  guidekaro_secret:
    file: ./secrets/guidekaro_secret.txt